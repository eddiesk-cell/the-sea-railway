<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Sea Railway — a spirited world</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b1020; }
  body {
    touch-action:none; user-select:none; -webkit-user-select:none;
    font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color:#f3e7d3;
  }
  canvas { display:block; width:100%; height:100%; }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

  /* ---- title card ---- */
  #title {
    position:absolute; left:clamp(20px,4vw,56px); bottom:clamp(20px,4vh,48px);
    text-shadow: 0 2px 24px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.9);
    transition: opacity 1.2s ease;
  }
  #title h1 {
    font-size:clamp(22px,3.4vw,40px); font-weight:500; letter-spacing:.06em;
    line-height:1.15; color:#fbeeda;
  }
  #title p {
    margin-top:.45em; font-size:clamp(11px,1.05vw,14px); letter-spacing:.22em;
    text-transform:uppercase; opacity:.62; font-family:ui-sans-serif,system-ui,sans-serif;
  }
  #title .rule { width:52px; height:1px; background:linear-gradient(90deg,#e8b06a,transparent); margin:14px 0 0; }

  /* ---- hints ---- */
  #hint {
    position:absolute; left:50%; bottom:clamp(18px,3.4vh,34px); transform:translateX(-50%);
    font-family:ui-sans-serif,system-ui,sans-serif; font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; opacity:0; transition:opacity .8s ease;
    text-shadow:0 1px 10px rgba(0,0,0,.9); white-space:nowrap;
  }
  #hint.show { opacity:.5; }

  #ride {
    position:absolute; left:50%; top:clamp(16px,3vh,30px); transform:translateX(-50%);
    font-family:ui-sans-serif,system-ui,sans-serif; font-size:11px; letter-spacing:.2em;
    text-transform:uppercase; opacity:0; transition:opacity .6s ease;
    text-shadow:0 1px 10px rgba(0,0,0,.9); white-space:nowrap; color:#f0c98a;
  }
  #ride.show { opacity:.72; }
  #hint b { font-weight:600; color:#f0c98a; letter-spacing:.14em; }

  /* ---- help panel ---- */
  #help {
    position:absolute; right:clamp(16px,2.4vw,32px); top:clamp(16px,2.4vh,32px);
    pointer-events:auto; font-family:ui-sans-serif,system-ui,sans-serif;
    background:rgba(14,18,32,.42); backdrop-filter:blur(16px) saturate(1.3);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid rgba(255,225,180,.14); border-radius:14px;
    padding:14px 16px; min-width:214px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    transition:opacity .4s ease, transform .4s ease;
  }
  #help.hidden { opacity:0; transform:translateY(-8px); pointer-events:none; }
  #help h2 {
    font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    opacity:.5; font-weight:600; margin-bottom:10px;
  }
  #help .row { display:flex; justify-content:space-between; gap:16px; font-size:12px; padding:3px 0; opacity:.86; }
  #help .row kbd {
    font-family:ui-monospace,monospace; font-size:10.5px; letter-spacing:.03em;
    background:rgba(255,235,205,.1); border:1px solid rgba(255,235,205,.14);
    border-radius:5px; padding:1px 6px; color:#f2d9ae;
  }
  #help .sep { height:1px; background:rgba(255,225,180,.12); margin:10px -16px 10px; }
  #help .toggle {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:12px; padding:5px 0; cursor:pointer; opacity:.9;
  }
  #help .toggle .sw {
    width:34px; height:19px; border-radius:99px; background:rgba(255,235,205,.14);
    position:relative; transition:background .25s ease; flex:none;
  }
  #help .toggle .sw::after {
    content:''; position:absolute; top:2px; left:2px; width:15px; height:15px;
    border-radius:99px; background:#f4e2c0; transition:transform .25s cubic-bezier(.4,1.4,.5,1);
  }
  #help .toggle.on .sw { background:rgba(232,176,106,.55); }
  #help .toggle.on .sw::after { transform:translateX(15px); background:#ffe9c2; }
  #help .slider { padding:5px 0 1px; }
  #help .slider label { display:flex; justify-content:space-between; font-size:12px; opacity:.86; margin-bottom:7px; }
  #help .slider label span { opacity:.6; font-variant-numeric:tabular-nums; }
  #help input[type=range] {
    -webkit-appearance:none; appearance:none; width:100%; height:3px; border-radius:99px;
    background:linear-gradient(90deg,#3f5f8a,#e8b06a,#2a3350); outline:none;
  }
  #help input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:13px; height:13px; border-radius:99px;
    background:#fbeeda; box-shadow:0 1px 6px rgba(0,0,0,.6); cursor:pointer;
  }

  /* ---- loader ---- */
  #load {
    position:fixed; inset:0; z-index:50; display:grid; place-items:center;
    background:#0b1020; transition:opacity 1.4s ease; text-align:center;
  }
  #load.done { opacity:0; pointer-events:none; }
  #load .k { font-size:13px; letter-spacing:.34em; text-transform:uppercase; opacity:.45;
             font-family:ui-sans-serif,system-ui,sans-serif; }
  #load .lamp {
    width:9px; height:9px; border-radius:99px; background:#e8b06a; margin:0 auto 22px;
    box-shadow:0 0 26px 9px rgba(232,176,106,.4); animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.35; transform:scale(.85);} 50%{opacity:1; transform:scale(1.15);} }

  @media (max-width: 720px) {
    #help { right:12px; top:12px; padding:11px 13px; min-width:0; }
    #help .row, #help .toggle, #help .slider label { font-size:11px; }
    #hint { font-size:10px; letter-spacing:.1em; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <div id="title">
      <h1>The Sea Railway</h1>
      <div class="rule"></div>
      <p>a spirited world</p>
    </div>

    <div id="ride"></div>

    <div id="hint"><b>drag</b> to look &nbsp;·&nbsp; <b>W A S D</b> to walk &nbsp;·&nbsp; <b>R</b> to ride the train &nbsp;·&nbsp; <b>H</b> for controls</div>

    <div id="help" class="hidden">
      <h2>Controls</h2>
      <div class="row"><span>Look around</span><kbd>drag</kbd></div>
      <div class="row"><span>Move</span><kbd>W A S D</kbd></div>
      <div class="row"><span>Rise / sink</span><kbd>space / C</kbd></div>
      <div class="row"><span>Glide faster</span><kbd>shift</kbd></div>
      <div class="row"><span>Ride the train</span><kbd>R</kbd></div>
      <div class="row"><span>Let go (cinematic)</span><kbd>F</kbd></div>
      <div class="sep"></div>
      <div class="toggle on" id="t-paint"><span>Painterly</span><i class="sw"></i></div>
      <div class="slider">
        <label>Hour <span id="v-time">dusk</span></label>
        <input type="range" id="s-time" min="0" max="100" value="44" />
      </div>
      <div class="slider">
        <label>Grass blades <span id="v-grass">1.6 M</span></label>
        <input type="range" id="s-grass" min="0" max="100" value="68" />
      </div>
      <div class="sep"></div>
      <div class="row" style="opacity:.55"><span>Frame rate</span><kbd id="v-fps">—</kbd></div>
      <div class="row" style="opacity:.45"><span>Hide this panel</span><kbd>H</kbd></div>
    </div>
  </div>

  <div id="load"><div><div class="lamp"></div><div class="k">lighting the lanterns</div></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
